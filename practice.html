<section>
<h2>Day 1: Visual data first</h2>
<ol>
<li><p>A crack classifier scores 94% on its validation set. On 300 crops from roadside cameras it scores 61%. What do you do first?</p><ul><li><b>A.</b> Train a larger backbone on the same training crops</li><li><b>B.</b> Report the average of the two numbers as the expected accuracy</li><li><b>C.</b> Break the 300 crops down by lighting, blur and viewpoint, with counts</li><li><b>D.</b> Add every augmentation available and retrain</li></ul></li>
<li><p>Two inspectors label 200 crops for "edge break". Raw agreement is 88%, Cohen's kappa is 0.31. What is the next step?</p><ul><li><b>A.</b> Read the crops they disagree on and rewrite the definition</li><li><b>B.</b> Accept the labels, since they agree on 88% of crops</li><li><b>C.</b> Add a third inspector and take the majority vote</li><li><b>D.</b> Ask both to label the 200 crops again, more carefully</li></ul></li>
<li><p>A crack classifier scores 96% with a random split of frames and 81% when whole road segments are held out. Nothing else changed. Which number do you report to the department?</p><ul><li><b>A.</b> 96%: a random split is the standard way to evaluate</li><li><b>B.</b> The mean of the two, about 88%</li><li><b>C.</b> Neither: the model got worse and must be retrained</li><li><b>D.</b> 81%: it is the score on roads the model has not seen</li></ul></li>
<li><p>A new class, "faded lane marking", is defined as paint that has lost most of its brightness against the road. Which augmentation is unsafe for it?</p><ul><li><b>A.</b> A left-right mirror</li><li><b>B.</b> Strong random brightness and contrast changes</li><li><b>C.</b> A shift of a few pixels in any direction</li><li><b>D.</b> A rotation by a few degrees</li></ul></li>
<li><p>Two inspectors label 400 crops for a rare defect. They give the same label to 372 crops, and Cohen's kappa is 0.28. What does the pair of numbers tell you?</p><ul><li><b>A.</b> The inspectors mostly agree by both saying "no"; on the defect itself they barely agree</li><li><b>B.</b> The labels are reliable, because 93% agreement is high</li><li><b>C.</b> Kappa was computed wrongly, because it cannot be far below raw agreement</li><li><b>D.</b> One inspector is careless and should be replaced</li></ul></li>
<li><p>A guideline says: "Label rutting when the wheel path looks sunken." Agreement between annotators is poor. Which rewrite is most likely to raise it?</p><ul><li><b>A.</b> "Label rutting when the wheel path looks clearly sunken to a trained eye."</li><li><b>B.</b> "Label rutting only when you are certain."</li><li><b>C.</b> "Label rutting as in the three example pictures."</li><li><b>D.</b> "Label rutting when a 2-metre straightedge across the lane would show a gap of 10 mm or more; if the depth cannot be judged from the frame, flag it."</li></ul></li>
<li><p>A dataset holds 9,000 frames from 300 road segments; each segment was filmed on several passes. You need a test set that predicts performance on roads never surveyed. How do you draw it?</p><ul><li><b>A.</b> Draw 15% of the frames at random</li><li><b>B.</b> Draw 15% of the frames at random, then delete exact duplicate files</li><li><b>C.</b> Draw 15% of the passes at random</li><li><b>D.</b> Draw 15% of the segments and take all their frames</li></ul></li>
<li><p>After re-splitting by road segment, 120 frames have no segment id and no near-duplicate that has one. What do you do with them?</p><ul><li><b>A.</b> Put them in the training set, where a few extra frames can only help</li><li><b>B.</b> Leave them out of training, validation and test</li><li><b>C.</b> Put them in the test set, to make it larger</li><li><b>D.</b> Assign each to a random segment so that no frame is wasted</li></ul></li>
<li><p>A class "arrow marking: turn left" is added to a road-marking classifier. Which augmentation must be removed from the pipeline for this class?</p><ul><li><b>A.</b> Random brightness changes</li><li><b>B.</b> A small random scale change</li><li><b>C.</b> A left-right mirror</li><li><b>D.</b> Gaussian blur</li></ul></li>
<li><p>True or false: if a perceptual hash finds no near-duplicate pairs across the training and test sets, the split is free of leakage.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Backbones and transfer</h2>
<ol>
<li><p>A field batch is sliced by lighting and viewpoint. The cell "night, pole camera" holds 6 crops and scores 17%; "dust, survey vehicle" holds 38 and scores 21%. What does the failure note say?</p><ul><li><b>A.</b> Night from a pole camera is the worst slice, at 17%</li><li><b>B.</b> The two worst slices average 19%</li><li><b>C.</b> Dust from the vehicle is the worst slice with enough crops; the night cell needs more</li><li><b>D.</b> Slices this small say nothing: report the overall score only</li></ul></li>
<li><p>Two backbones are scored on the same 320 test crops. A reaches 88% with an interval from 84% to 91%, B 90% with an interval from 87% to 93%. The department must choose one this week. What is the next step?</p><ul><li><b>A.</b> Bootstrap the difference between the two per crop and read its interval</li><li><b>B.</b> Choose B: it is two points better</li><li><b>C.</b> Declare a tie and choose the smaller model</li><li><b>D.</b> Train both for longer until the intervals separate</li></ul></li>
<li><p>On 150 labelled crops a linear probe scores 79%. Full fine-tuning of the same backbone on the same crops, for 30 passes at a from-scratch learning rate, scores 71%. What is the likely explanation?</p><ul><li><b>A.</b> The backbone is unsuited to road images</li><li><b>B.</b> The fine-tuning code has a bug: it can never score below a probe</li><li><b>C.</b> There are too few labels: 2,000 more crops must come first</li><li><b>D.</b> The fine-tuning damaged the pretrained features: too high a rate, too many passes</li></ul></li>
<li><p>An image-text model scores 28% on five defect classes with the class names as prompts. Always answering the most common class scores 32%. A colleague reports: "the floor is 28%". What do you correct?</p><ul><li><b>A.</b> Nothing: 28% is above the 20% of chance</li><li><b>B.</b> The floor is the best answer without labels: 32% so far, and better prompts come first</li><li><b>C.</b> The floor is dropped from the report: the model is unsuited</li><li><b>D.</b> The model is fine-tuned on the defect crops, and that score is the floor</li></ul></li>
<li><p>A backbone's record gives the weights licence as "mit". Its model page says the training dataset was released "for research purposes only". The rule lets permissive weights be deployed. What do you write?</p><ul><li><b>A.</b> Deploy; the licence is permissive, and nothing else is recorded</li><li><b>B.</b> Do not deploy; a dataset's terms always override the weights licence</li><li><b>C.</b> The rule's decision, the dataset with its stated terms, and a flag for the legal officer</li><li><b>D.</b> Deploy; the remark is left out, since the record field is what counts</li></ul></li>
<li><p>On 40 night crops, backbone A scores 80% with a 95% interval of 68% to 92%, and backbone B scores 85% with 73% to 95%. What may you conclude about night?</p><ul><li><b>A.</b> B is better at night by five points</li><li><b>B.</b> A and B are equally good at night</li><li><b>C.</b> The intervals are too wide, so the bootstrap was done incorrectly</li><li><b>D.</b> This test cannot separate the two at night; more night crops or a paired comparison is needed</li></ul></li>
<li><p>With 300 labelled crops, a linear probe on a frozen backbone reaches 84% and full fine-tuning reaches 82%. With 3,000 labels full fine-tuning reaches 93%. Labelling 3,000 crops takes two weeks. The pilot needs a model on Monday. What do you ship first?</p><ul><li><b>A.</b> The linear probe on 300 labels, and start labelling towards 3,000</li><li><b>B.</b> The fully fine-tuned model on 300 labels, because full fine-tuning is the stronger method</li><li><b>C.</b> Nothing until 3,000 labels exist</li><li><b>D.</b> A model trained from scratch on the 300 labels, to avoid depending on pretrained weights</li></ul></li>
<li><p>A zero-shot image-text model scores 71% on five defect classes with well-written prompts. Your fine-tuned classifier, built on 2,000 labelled crops, scores 74%. How do you report this?</p><ul><li><b>A.</b> As a success: the fine-tuned model has the higher score</li><li><b>B.</b> As a failure of the zero-shot model, which did not reach 74%</li><li><b>C.</b> As 74%, without mentioning the zero-shot result, since it used no training</li><li><b>D.</b> As a three-point gain over a floor that cost no labels, which questions the value of the labelling so far</li></ul></li>
<li><p>You compare a convolutional backbone and a vision transformer on defect crops. Which setup makes the comparison fair?</p><ul><li><b>A.</b> The same training crops, test crops, input size and number of passes, each with a learning rate tuned for it on validation data</li><li><b>B.</b> The same learning rate for both, whatever it does to each</li><li><b>C.</b> Each on the input size from its own paper, tested on its own split</li><li><b>D.</b> The transformer on more passes, because transformers need more data</li></ul></li>
<li><p>A backbone's code is under Apache-2.0 and its pretrained weights are under CC-BY-NC-4.0. A contractor will run it on roadside units for a city under a paid contract. May these weights be deployed?</p><ul><li><b>A.</b> Yes: the code licence is permissive and covers the whole model</li><li><b>B.</b> Yes: a city is a public body, so its use is non-commercial</li><li><b>C.</b> Not under these terms: the weights carry a non-commercial licence and this is paid operation</li><li><b>D.</b> Yes, after fine-tuning: fine-tuned weights are a new work free of the original terms</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Detect, segment and track</h2>
<ol>
<li><p>A colleague fine-tuned weights under a non-commercial licence on the department's own crops. It is the best model in the table. A contractor will run the units under a paid contract. What happens next?</p><ul><li><b>A.</b> Deploy it: fine-tuning on its own data made the weights the department's</li><li><b>B.</b> Do not deploy it: record that, and compare again from weights the rule allows</li><li><b>C.</b> Deploy it: the library is under Apache-2.0</li><li><b>D.</b> Deploy it as a pilot: a pilot is not commercial use</li></ul></li>
<li><p>Detector A scores an AP of 0.90 at IoU 0.5 and 0.70 at IoU 0.75. Detector B scores 0.93 and 0.45. The department will use the boxes to estimate how much asphalt each repair needs. Which do you choose?</p><ul><li><b>A.</b> B: it finds more potholes, and finding them is what counts</li><li><b>B.</b> B: AP at IoU 0.5 is the standard metric for detectors</li><li><b>C.</b> A: it has the higher score at both thresholds</li><li><b>D.</b> A: its boxes fit the potholes, and area is read from the box</li></ul></li>
<li><p>An oracle table for a crack-sealing detector shows: localisation errors repaired +0.09 F1, missed +0.07, class +0.01, duplicate +0.01. The team's boxes come from three annotators with no rule on tightness. What do you propose first?</p><ul><li><b>A.</b> Write the box-tightness rule, relabel a sample and measure localisation again</li><li><b>B.</b> Tighten non-maximum suppression, because it needs no training</li><li><b>C.</b> Train a larger detector on the same labels</li><li><b>D.</b> Lower the score threshold so that fewer objects are missed</li></ul></li>
<li><p>A crack segmenter scores an IoU of 0.52. Its masks, overlaid on the frames, follow every crack and look about one pixel wider than the labels. What do you report?</p><ul><li><b>A.</b> The model is poor and needs a larger backbone</li><li><b>B.</b> Pixel accuracy, which is 99% and describes the model better</li><li><b>C.</b> The IoU with the object's width, and precision and recall at a two-pixel tolerance</li><li><b>D.</b> Dice, because it is higher for the same masks</li></ul></li>
<li><p>On a new camera the tracker reports 52 crossings against 50 true ones, with 3 identity switches. The clips are at dusk, and short tracks appear beside some vehicles. Which change do you try first?</p><ul><li><b>A.</b> Require more hits before a track is counted</li><li><b>B.</b> Raise the patience so that tracks survive longer gaps</li><li><b>C.</b> Count every crossing of the line, not one per track</li><li><b>D.</b> Retrain the detector on dusk frames before changing anything</li></ul></li>
<li><p>A pothole detector has an average precision of 0.91 at IoU 0.5 and 0.48 at IoU 0.75. What does the gap point to?</p><ul><li><b>A.</b> Many potholes are missed entirely</li><li><b>B.</b> Boxes sit on the potholes but do not fit them tightly, or the labelled boxes are inconsistent in tightness</li><li><b>C.</b> The detector confuses potholes with patches</li><li><b>D.</b> The score threshold is set too high</li></ul></li>
<li><p>After a software update the detector reports three overlapping boxes on most potholes, and average precision at IoU 0.5 falls sharply although nothing was retrained. What is the first thing to check?</p><ul><li><b>A.</b> The non-maximum suppression threshold, which may have been loosened or switched off</li><li><b>B.</b> The learning rate of the last training run</li><li><b>C.</b> Whether the test labels were changed</li><li><b>D.</b> The class weights of the loss</li></ul></li>
<li><p>A detection is labelled "patch" and overlaps a ground-truth pothole with IoU 0.82. No other detection touches that pothole. Which error type is it?</p><ul><li><b>A.</b> Localisation</li><li><b>B.</b> Duplicate</li><li><b>C.</b> Missed</li><li><b>D.</b> Class</li></ul></li>
<li><p>An oracle analysis of a detector gives these gains in average precision if each error type were fully fixed: duplicates +0.06, class +0.01, localisation +0.03, missed +0.05. Tightening suppression takes ten minutes; collecting data for missed defects takes three weeks. What do you do first?</p><ul><li><b>A.</b> Tighten suppression, measure again, then plan the data collection from the new table</li><li><b>B.</b> Collect data for the missed defects, because recall matters most</li><li><b>C.</b> Relabel all boxes for localisation</li><li><b>D.</b> Work on class confusion, since it is the hardest</li></ul></li>
<li><p>A crack segmenter scores IoU 0.55. Its masks follow every crack, shifted by about one pixel. The cracks are two to three pixels wide. How should the result be reported?</p><ul><li><b>A.</b> As poor: an IoU of 0.55 means nearly half of the cracks are missed</li><li><b>B.</b> As IoU 0.55 together with a score that allows a small tolerance, and example masks</li><li><b>C.</b> As pixel accuracy, which is above 97%</li><li><b>D.</b> As Dice only, because it is the higher number</li></ul></li>
<li><p>True or false: a thresholding baseline that marks dark pixels as cracks is not worth scoring once a neural segmenter is available.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>On a clip with 20 vehicles crossing the line, a tracker reports a count of 20 and 15 identity switches. The traffic team will use it only for counts on this camera. What do you tell them?</p><ul><li><b>A.</b> The count cannot be trusted, because the identities are wrong</li><li><b>B.</b> The tracker is ready for any use</li><li><b>C.</b> Identity switches do not matter for any application</li><li><b>D.</b> For counting on this camera the evidence supports it; it is not fit for uses that follow a vehicle, such as travel time</li></ul></li>
<li><p>In slow traffic a counter reports 31 vehicles where 22 crossed. Its rule adds one whenever a box centre moves from above the line to below it. What is the most likely cause, and the fix?</p><ul><li><b>A.</b> Boxes jitter back and forth across the line; count each track at most once</li><li><b>B.</b> Missed detections; lower the detector's score threshold</li><li><b>C.</b> The line is too close to the camera; move it further away</li><li><b>D.</b> False detections; raise the score threshold</li></ul></li>
<li><p>At night the detector misses a vehicle in about one frame in eight. The tracker closes a track as soon as one frame has no matching detection. What happens to the count, and which setting addresses it?</p><ul><li><b>A.</b> Counts rise; require more hits before a track is reported</li><li><b>B.</b> Counts are unaffected; nothing needs to change</li><li><b>C.</b> Tracks break at misses, and a break at the line loses a count; let a track survive a few frames without a detection</li><li><b>D.</b> Counts fall; lower the overlap threshold for matching to zero</li></ul></li>
<li><p>Which pair of numbers is the evidence that a counting service works on a set of clips with ground truth?</p><ul><li><b>A.</b> Detector average precision and frames per second</li><li><b>B.</b> Count error per clip and the number of identity switches</li><li><b>C.</b> The total count over all clips and the average track length</li><li><b>D.</b> Training loss and validation loss of the detector</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Fit the budget and release</h2>
<ol>
<li><p>On a rain frame the detector puts two pothole boxes on one pothole: one with a score of 0.84 and an IoU of 0.81 with the truth, one with 0.61 and 0.66. How is the second box counted, and what removes it?</p><ul><li><b>A.</b> A true positive; nothing needs removing</li><li><b>B.</b> A localisation error; a box guideline removes it</li><li><b>C.</b> A duplicate, counted as a false positive; tighter suppression removes it</li><li><b>D.</b> A background error; more rain frames remove it</li></ul></li>
<li><p>After a runtime upgrade the stored parity test reports a largest difference of 0.004 against a tolerance of 0.001, and 2 of 30 boxes have no partner. The model file did not change. What do you do?</p><ul><li><b>A.</b> Raise the tolerance to 0.01, since 28 of 30 boxes still agree</li><li><b>B.</b> Release with the proven versions, and find what changed before upgrading</li><li><b>C.</b> Release with the upgrade: differences this small are float rounding</li><li><b>D.</b> Retrain the detector with the upgraded library installed</li></ul></li>
<li><p>The budget is 50 ms per frame at the 95th percentile. On the unit, model A has a median of 31 ms and a 95th percentile of 64 ms; model B 38 ms and 46 ms. Model A is one point more accurate. Which do you deploy?</p><ul><li><b>A.</b> Model A: its median is lower and it is more accurate</li><li><b>B.</b> Model A: the mean of its two numbers is under 50 ms</li><li><b>C.</b> Neither, until both are measured again with batch size 8</li><li><b>D.</b> Model B: it is the only one inside the budget</li></ul></li>
<li><p>The rule: pass when the upper end of the drop interval is at most 0.10, human check up to 0.30, otherwise hold. In fog the detector's drop is 0.08 with an interval from 0.01 to 0.33, measured on 25 frames. What is the decision?</p><ul><li><b>A.</b> Hold in fog, and collect more fog frames to narrow the interval</li><li><b>B.</b> Pass: the drop of 0.08 is below 0.10</li><li><b>C.</b> Release with a human check: the truth is probably in between</li><li><b>D.</b> Pass: with only 25 frames the interval is too wide to count</li></ul></li>
<li><p>A counting camera's daily vehicle count falls by a third and stays there. The counts of the neighbouring cameras are unchanged, and it has not rained. Which monitor would have told the field team why?</p><ul><li><b>A.</b> The brightness of the frames against the first week</li><li><b>B.</b> The count itself against last month's average</li><li><b>C.</b> The offset of the lane markings from their installed position</li><li><b>D.</b> The mean score of the detections per day</li></ul></li>
<li><p>A roadside unit must process each frame within 60 ms. Measured on the unit: median 41 ms, 95th percentile 74 ms. Does the model meet the budget?</p><ul><li><b>A.</b> Yes: the median is well inside the budget</li><li><b>B.</b> Yes: the average of the two numbers is under 60 ms</li><li><b>C.</b> No: one frame in twenty takes longer than the budget allows</li><li><b>D.</b> It cannot be said without the maximum</li></ul></li>
<li><p>You quantise a detector to 8-bit integers. The file shrinks to a quarter and latency falls by 40%. What must happen before it replaces the 32-bit model?</p><ul><li><b>A.</b> Its accuracy is measured again on the same validation frames, by condition</li><li><b>B.</b> Nothing: quantisation does not change predictions</li><li><b>C.</b> It is retrained from scratch</li><li><b>D.</b> Its input resolution is raised to make up for the lost precision</li></ul></li>
<li><p>An exported model gives outputs within 0.00001 of the original in your test. On the device, the same file detects almost nothing. Where do you look first?</p><ul><li><b>A.</b> In the exported graph, for an operation that was converted wrongly</li><li><b>B.</b> In the training data, for label noise</li><li><b>C.</b> In the device's preprocessing: channel order, value range and resizing</li><li><b>D.</b> In the model's architecture, which may be too large for the device</li></ul></li>
<li><p>Benchmark rows that meet the size limit: 192 pixels, 71 ms, AP 0.88; 160 pixels, 52 ms, AP 0.84; 128 pixels, 36 ms, AP 0.66. The budget is 60 ms at the 95th percentile, which these latencies are. Which operating point do you choose?</p><ul><li><b>A.</b> 192 pixels: accuracy comes first</li><li><b>B.</b> 128 pixels: the fastest is the safest</li><li><b>C.</b> 160 pixels: the most accurate row inside the budget</li><li><b>D.</b> None: the budget should be renegotiated to 71 ms</li></ul></li>
<li><p>To measure the effect of rain on a detector you can (a) compare a clean test set with a different set of rainy frames, or (b) apply rain to the same test frames. Why does (b) give a tighter estimate of the drop?</p><ul><li><b>A.</b> It uses more frames</li><li><b>B.</b> Each frame is its own control, so differences between scenes cancel</li><li><b>C.</b> Synthetic rain is easier for a detector than real rain</li><li><b>D.</b> It avoids the need for ground truth</li></ul></li>
<li><p>The release rule says: a condition passes when the upper end of the 95% interval of its accuracy drop is at most 0.10. For glare the drop is 0.06 with an interval of 0.01 to 0.14, on 60 frames. What is the decision?</p><ul><li><b>A.</b> Pass: the drop of 0.06 is below 0.10</li><li><b>B.</b> Fail for now: the upper end is 0.14; test more glare frames or apply the fallback for failed conditions</li><li><b>C.</b> Pass: most of the interval lies below 0.10</li><li><b>D.</b> Fail permanently: the detector cannot handle glare</li></ul></li>
<li><p>A pole camera was knocked and now looks at the road from a different angle. Its brightness and sharpness are unchanged, and its counts fall slowly. Which monitor would have caught it on the first days?</p><ul><li><b>A.</b> Mean brightness against the first week</li><li><b>B.</b> Sharpness against the first week</li><li><b>C.</b> The position of fixed scene features, such as lane markings, against their position at installation</li><li><b>D.</b> The model's average confidence</li></ul></li>
<li><p>Faces and plates are blurred before frames are stored. At the detector's default threshold 84% of them are blurred and 1% of the image area is affected; at a low threshold 99% are blurred and 3% of the area. Which setting fits a rule that nothing readable is stored?</p><ul><li><b>A.</b> The default threshold: fewer false alarms means a cleaner archive</li><li><b>B.</b> The default threshold: 84% is a high recall</li><li><b>C.</b> No blurring: the frames are only used internally</li><li><b>D.</b> The low threshold: a blurred patch of wall costs little, a stored readable plate breaks the rule</li></ul></li>
<li><p>Which statement belongs in the results section of a model card for a roadside pothole detector?</p><ul><li><b>A.</b> "The model achieves state-of-the-art accuracy."</li><li><b>B.</b> "AP at IoU 0.5 is 0.89 on clean frames; under heavy rain it falls by 0.12 (0.07 to 0.18); night detections go to an inspector before a crew is sent."</li><li><b>C.</b> "The model was trained for 30 passes with AdamW."</li><li><b>D.</b> "The model should be used responsibly."</li></ul></li>
<li><p>True or false: if a detector meets its accuracy target on the whole test set, it meets it in every district of the city.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
