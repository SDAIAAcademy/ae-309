[project]
name = "computer-vision-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course AE-309 Computer Vision Engineering"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.6",
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0.15",
    "open-clip-torch>=2.30",
    "onnx>=1.17",
    "onnxruntime>=1.21",
    "psutil>=6.0",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[tool.uv]
package = false

# CPU wheels of PyTorch for a laptop: the labs' quick mode needs no graphics processor
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
